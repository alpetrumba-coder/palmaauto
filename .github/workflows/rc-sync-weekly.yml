name: Weekly RealtyCalendar reconcile

# Раз в неделю (понедельник 08:00 по Москве) просит сервис ПальмаАвто сверить брони RealtyCalendar с заездами.
# Нужны секреты репозитория: RC_SYNC_URL (адрес https://palmaauto.ru/api/cron/rc-sync) и CRON_SECRET (тот же, что в настройках сервера).
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Call reconcile endpoint
        env:
          RC_SYNC_URL: ${{ secrets.RC_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$RC_SYNC_URL" && test -n "$CRON_SECRET" || { echo "Не заданы секреты RC_SYNC_URL / CRON_SECRET"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 280 -X POST -H "Authorization: Bearer $CRON_SECRET" "$RC_SYNC_URL"
